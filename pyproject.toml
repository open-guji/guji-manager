[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guji-manager"
version = "0.4.38"
description = "古籍 pipeline manager：工作区、取图、打包推中心库、任务库等对外交互；调用 open-guji-cv（pipeline）但自己不含识别算法"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
triage = ["numpy", "opencv-python-headless", "scikit-learn", "rapidocr-onnxruntime>=1.2,<1.3"]

[project.entry-points."guji.commands"]
manager = "guji_manager.commands"

[project.entry-points."guji.hooks"]
manager = "guji_manager.hooks:register"

[project.entry-points."guji.post_promote"]
online_lists = "guji_manager.online_lists:on_promote"

[project.scripts]
guji-manager = "guji_manager.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guji_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
guji_manager = ["review_triage/review_grid.tpl.html", "opinions/rules.json", "review/pending_reasons.yaml", "datastore/schema.sql", "jobs/schema.sql", "review_pages/templates/*"]
