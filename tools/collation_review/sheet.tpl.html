<title>殿本参校待判</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* 版面：顶栏（进度＋筛选）＋ 一列审阅卡；每卡左图（本列／放大）右文（读法与点选） */
:root{
  --paper:#f7f6f2; --card:#ffffff; --ink:#1f2328; --muted:#646a73; --line:#dedcd5;
  --zhu:#b8322a; --zhu-soft:#f6e3e0; --ok:#2d7a4f; --ok-soft:#e2f1e8; --chip:#efede7;
  --serif:"Noto Serif TC","Songti TC","SimSun",serif;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17181a; --card:#212226; --ink:#e9e7e2; --muted:#a2a29c; --line:#36373b;
  --zhu:#e2675d; --zhu-soft:#3b2524; --ok:#6cc392; --ok-soft:#1f3328; --chip:#2c2d31; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17181a; --card:#212226; --ink:#e9e7e2; --muted:#a2a29c; --line:#36373b;
  --zhu:#e2675d; --zhu-soft:#3b2524; --ok:#6cc392; --ok-soft:#1f3328; --chip:#2c2d31; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-block:12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-family:var(--serif);font-size:20px;margin:0;font-weight:700}
.batch{color:var(--muted);font-size:13px}
.prog{font-variant-numeric:tabular-nums;font-size:14px}
.prog b{color:var(--zhu)}
.sp{flex:1}
.tabs{display:flex;gap:4px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 10px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.all{border-color:var(--zhu);color:var(--zhu)}
.status{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:16px;align-items:start}
.card.done{border-color:var(--ok)}
.card.rule{grid-template-columns:minmax(0,1fr)}
.colimg{height:380px;width:auto;border:1px solid var(--line);background:#fff}
.zimg{width:200px;border:1px solid var(--line);background:#fff}
.figs{display:contents}
.info{min-width:0;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted)}
.chip{background:var(--chip);border-radius:4px;padding:1px 7px}
.chip.k{background:var(--zhu-soft);color:var(--zhu)}
.ctx{font-family:var(--serif);font-size:22px;letter-spacing:.06em;word-break:break-all}
.ctx em{font-style:normal;color:var(--zhu);border-bottom:2px solid var(--zhu)}
.reads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:13px}
.reads div{background:var(--chip);border-radius:6px;padding:4px 8px}
.reads span{display:block;color:var(--muted);font-size:11.5px}
.reads b{font-family:var(--serif);font-size:20px;font-weight:500}
.note{font-size:14px}
.rec{font-size:14px}.rec b{font-family:var(--serif);font-size:18px;color:var(--zhu)}
.picks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pk{font-family:var(--serif);font-size:22px;min-width:52px;padding:4px 12px}
.pk.r{border-color:var(--zhu)}
.pk[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.other{width:7em;font:inherit;font-family:var(--serif);font-size:18px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
textarea{font:inherit;width:100%;min-height:34px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);resize:vertical}
.saved{font-size:13px;color:var(--ok)}
.err{color:var(--zhu)}
.why{color:var(--muted);font-size:14px}
@media (max-width:720px){
  .card{grid-template-columns:auto minmax(0,1fr)}
  .info{grid-column:1/-1}
  .colimg{height:300px}.zimg{width:150px}
  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>

<div class="wrap">
  <header>
    <div><h1>殿本参校待判</h1><div class="batch">{{BATCH}}</div></div>
    <div class="prog" id="prog"></div>
    <div class="sp"></div>
    <div class="tabs" role="group" aria-label="筛选">
      <button id="f-todo" aria-pressed="true">未判</button>
      <button id="f-done" aria-pressed="false">已判</button>
      <button id="f-all" aria-pressed="false">全部</button>
    </div>
    <button class="all" id="allrec">其余全照建议</button>
    <div class="status" id="status">连接中…</div>
  </header>
  <div class="list" id="list"></div>
</div>

<script>
const D = /*DATA*/null;
const state = {dec:{}, filter:'todo', db:null, confirmAll:false};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ctxHtml = s => esc(s).replace(/【(.*?)】/, '<em>$1</em>');
const units = () => [D.rule ? {...D.rule, isRule:true} : null, ...D.items].filter(Boolean);

function choices(it){
  if (it.isRule) return it.options;
  const out = [];
  for (const c of [it.rec, it.base, it.dzg, it.wiki]) if (c && !out.includes(c)) out.push(c);
  return out;
}

function card(it){
  const d = state.dec[it.id];
  const el = document.createElement('section');
  el.className = 'card' + (it.isRule ? ' rule' : '') + (d ? ' done' : '');
  el.id = 'c-' + it.id;
  const opts = choices(it);
  const picked = d?.pick;
  const otherVal = picked && !opts.includes(picked) ? picked : '';
  el.innerHTML = (it.isRule ? '' : `
    <img class="colimg" src="${it.col}" alt="第${+it.vol}册 ${esc(it.cell)} 所在列，红框为本格">
    <img class="zimg" src="${it.zoom}" alt="本格放大">`) + `
    <div class="info">
      <div class="meta">${it.isRule ? '<span class="chip k">口径</span>' :
        `<span class="chip k">${esc(it.kind)}</span><span class="chip">第${+it.vol}册 ${esc(it.cell)}</span><span class="chip">${esc(it.id)}</span>`}</div>
      ${it.isRule ? `<div class="ctx">${esc(it.q)}</div><div class="why">${esc(it.why)}</div>` : `
      <div class="ctx">${ctxHtml(it.ctx)}</div>
      <div class="reads">
        <div><span>底本（现录）</span><b>${esc(it.base)}</b></div>
        <div><span>殆知阁</span><b>${esc(it.dzg || '—')}</b></div>
        <div><span>维基</span><b>${esc(it.wiki || '—')}</b></div>
        <div><span>已有人裁</span><b style="font-size:15px">${esc(it.human)}</b></div>
      </div>
      <div class="note">${esc(it.note)}</div>`}
      <div class="rec">建议：<b>${esc(it.rec)}</b></div>
      <div class="picks">
        ${opts.map(o => `<button class="pk${o === it.rec ? ' r' : ''}" data-v="${esc(o)}" aria-pressed="${picked === o}">${esc(o)}</button>`).join('')}
        ${it.isRule ? '' : `<input class="other" id="o-${esc(it.id)}" placeholder="其他字" value="${esc(otherVal)}" aria-label="录作其他字">`}
      </div>
      <textarea id="n-${esc(it.id)}" placeholder="备注（可不填）" aria-label="备注">${esc(d?.note || '')}</textarea>
      <div class="saved" id="s-${esc(it.id)}">${d ? '已存：' + esc(d.pick) + (d.pick === it.rec ? '（照建议）' : '') : ''}</div>
    </div>`;
  el.querySelectorAll('.pk').forEach(b => b.onclick = () => save(it, b.dataset.v));
  const o = el.querySelector('.other');
  if (o) o.onchange = () => { const v = o.value.trim(); if (v) save(it, v); };
  const n = el.querySelector('textarea');
  n.onchange = () => { const cur = state.dec[it.id]; if (cur) save(it, cur.pick); };
  return el;
}

function render(){
  const all = units();
  const done = all.filter(u => state.dec[u.id]).length;
  $('#prog').innerHTML = `已判 <b>${done}</b> / ${all.length}`;
  const show = all.filter(u => state.filter === 'all' || (state.filter === 'done') === !!state.dec[u.id]);
  const list = $('#list'); list.replaceChildren(...show.map(card));
  if (!show.length) list.innerHTML = `<p class="why">${state.filter === 'todo' ? '全部判完了，谢谢。结果已存，我这边会读回去处理。' : '还没有已判的条目。'}</p>`;
  const b = $('#allrec');
  b.hidden = !state.db || done === all.length;
  b.textContent = state.confirmAll ? `确认：其余 ${all.length - done} 条全照建议` : '其余全照建议';
}

async function save(it, pick){
  if (!state.db){ $('#status').textContent = '没连上存储，选择没有保存'; $('#status').className = 'status err'; return; }
  const note = (document.getElementById('n-' + it.id)?.value || '').trim();
  const doc = {pick, note, rec: it.rec, batch: D.batch, at: new Date().toISOString()};
  state.dec[it.id] = doc; render();
  try { await state.db.collection('decisions').doc(it.id).set(doc); }
  catch(e){ $('#status').textContent = '保存失败：' + (e?.message || e?.code || e); $('#status').className = 'status err'; }
}

$('#allrec').onclick = async () => {
  if (!state.confirmAll){ state.confirmAll = true; render(); return; }
  state.confirmAll = false;
  for (const u of units()) if (!state.dec[u.id]) await save(u, u.rec);
};
for (const f of ['todo','done','all']) $('#f-' + f).onclick = () => {
  state.filter = f; for (const g of ['todo','done','all']) $('#f-' + g).setAttribute('aria-pressed', g === f); render();
};

render();
(async () => {
  const timer = setTimeout(() => { if (!state.db){ $('#status').textContent = '存储没响应，可以看，选择不会保存'; } }, 10000);
  const db = await (window.claude?.use?.('db') ?? Promise.resolve(null)).catch(() => null);
  clearTimeout(timer);
  if (!db){ $('#status').textContent = '只读：登录后才能保存选择'; return; }
  state.db = db;
  db.collection('decisions').onSnapshot(snap => {
    const ids = new Set(units().map(u => u.id)); const dec = {};
    for (const d of snap.docs) if (ids.has(d.id)) dec[d.id] = d.data();
    state.dec = dec; $('#status').textContent = '选择自动保存'; $('#status').className = 'status'; render();
  }, e => { $('#status').textContent = '读取失败：' + e.message; $('#status').className = 'status err'; });
})();
</script>
