# 本仓测试：推 dev／rc／main 与每个 PR 都跑，另每天对 cv dev 最新跑一次。
# cv 改了 manager 用到的内部（门面 manager_api 之外的也算），这里第二天就红，不等执行机上才炸。
name: test

on:
  push:
    branches: [dev, main, "rc/**"]
  pull_request:
  schedule:
    - cron: "17 13 * * *"   # 每天 UTC 13:17（洛杉矶早上 5–6 点）
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装 cv dev 与本仓
        run: |
          python -m pip install --upgrade pip
          pip install "open-guji-cv @ git+https://github.com/open-guji/open-guji-cv@dev"
          pip install -e ".[dev]"
      - name: 测试
        run: python -m pytest tests -q -p no:cacheprovider
