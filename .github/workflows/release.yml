name: Release assets

# 推 vX.Y.Z / vX.Y.Z-rc.N tag 时，构建 wheel ＋ sdist 并挂到该 tag 的 GitHub Release
# （没有就建；MINOR 的正文由人手写，已有 Release 时只补附件）。规矩见 doc/版本号规矩.md。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（如 v0.2.0）
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 正式版的两处版本号须与 tag 一致（rc 不查：版本号在发版时才改）
        run: |
          case "$TAG" in *-rc.*) exit 0;; esac
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          p=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('guji_manager/__init__.py',encoding='utf-8').read()).group(1))")
          [ "v$v" = "$TAG" ] || { echo "pyproject 版本 $v 与 tag $TAG 不符"; exit 1; }
          [ "v$p" = "$TAG" ] || { echo "guji_manager.__version__ $p 与 tag $TAG 不符"; exit 1; }
      - name: 构建 wheel 与 sdist
        run: |
          pip install build
          python -m build --outdir dist/release
          (cd dist/release && sha256sum * > SHA256SUMS)
      - name: 建 Release（若无）并上传附件
        run: |
          pre=""; case "$TAG" in *-rc.*) pre="--prerelease";; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" $pre --verify-tag --title "guji-manager $TAG" \
              --notes "自动构建的安装包。安装：pip install --no-deps guji_manager-*.whl（或 pip install \"guji-manager @ git+https://github.com/open-guji/guji-manager@$TAG\"）。变更见 CHANGELOG.md。"
          fi
          gh release upload "$TAG" dist/release/* --clobber
