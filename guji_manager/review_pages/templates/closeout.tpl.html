<title>收口单</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*COMMON_CSS*/
.opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}.opts label{border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;min-height:36px}
.opts label.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}.opts label.pre::after{content:" 预选";font-size:10px;opacity:.8}.opts input[type=radio]{margin-right:4px}
.gk{font:600 18px/1.3 var(--font-ui)}.ex{font:15px/1.6 var(--font-glyph);color:var(--muted)}
.sum{max-width:1100px;margin:8px auto;display:flex;gap:8px;flex-wrap:wrap}.sum .card{margin:0;flex:1 1 150px}.sum b{font-size:20px;display:block}
</style>
/*SHELL*/
<div class="sum" id="sum"></div>
<script>
const D=/*DATA*/null;
/*COMMON_JS*//*STORE_JS*//*PAGER_JS*/
// 收口单：每类剩余格一行（类别、格数、占比、例子），定去向：人审底／留后／精校待办／再处理；合计显示各去向格数。
const items=D.items.map(x=>Object.assign({id:x.id||x.key},x));
let R;
function sum(){
  const by={};let tot=0;for(const o of D.options)by[o]=0;by["未定"]=0;
  for(const it of items){const h=R.S.how(it.id);const raw=R.S.raw(it.id)||{};const k=h?(raw.pick??it.pre??"未定"):"未定";by[k]=(by[k]||0)+(it.n||0);tot+=it.n||0}
  const el=$("sum");el.textContent="";
  for(const [k,n] of Object.entries(by)){const c=document.createElement("div");c.className="card";const b=document.createElement("b");b.textContent=n;c.append(b,`${k}（${tot?(n/tot*100).toFixed(1):"0"}%）`);el.appendChild(c)}
}
R=makePager({key:"closeout",prefix:"c",all:items,per:D.per_page,
  hintText:D.hint||"每类剩余格定去向：人审底（真异文、断烂图源等，永远要人）／留后（随标点、专名阶段）／精校待办／再处理（还能压，再跑一轮）。预选带标，不同意就改；每点一下就存。全部确认后合计即是收口单。",
  legacy:[],
  gate:null,
  draw(it,box,v,save){
    const cur=()=>v.pick??it.pre??"再处理";
    const hd=document.createElement("div");hd.className="gk";hd.textContent=`${it.label||it.id}　${it.n||0} 格${it.rate!=null?"（"+(it.rate*100).toFixed(2)+"%）":""}`;
    const ex=document.createElement("div");ex.className="ex";ex.textContent=(it.examples||[]).join("　");
    const op=document.createElement("div");op.className="opts";
    for(const o of D.options){const lb=document.createElement("label");const r=document.createElement("input");r.type="radio";r.name="c_"+it.id;r.checked=cur()===o;
      lb.className=(r.checked?"sel":"")+(it.pre===o?" pre":"");lb.append(r,o);
      r.onchange=()=>{v.pick=o;save();for(const l of op.querySelectorAll("label"))l.classList.remove("sel");lb.classList.add("sel");sum()};op.appendChild(lb)}
    const nt=document.createElement("input");nt.type="text";nt.placeholder="备注";nt.value=v.note||"";nt.oninput=()=>{v.note=nt.value;save()};op.appendChild(nt);
    box.append(hd,ex,op);
  },
  doc(it,v){return {key:it.id,pre:it.pre??null,pick:v.pick??it.pre??"再处理",n:it.n||0,label:it.label||null,note:v.note||""}}});
sum();setInterval(sum,1500);
</script>
