<title>一字一卡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*COMMON_CSS*/
.cardhead{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.big{font:600 40px/1 var(--font-glyph);min-width:1.3em;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cardhead input{width:3.2em;font:600 22px/1 var(--font-glyph);text-align:center}
</style>
/*SHELL*/
<script>
const D=/*DATA*/null;
/*COMMON_JS*/
// 每页 per_page 张卡；卡默认全对：样例点「不对」变红；预选字不对就在框里改字（整卡改）
const KEY="char-card-"+D.book+"-"+D.tpl_version, P=D.per_page, NP=Math.ceil(D.cards.length/P);
let st=lsGet(KEY,{bad:{},pick:{},seen:0,page:0});
function pageDoc(pi){
  const cs=D.cards.slice(pi*P,(pi+1)*P), items=[], cards=[];
  for(const c of cs){
    const pick=st.pick[c.char]||c.char, bad=c.samples.filter(s=>st.bad[s.id]).map(s=>s.id);
    cards.push({char:c.char,pick,bad,n:c.n});
    for(const s of c.samples)items.push({id:s.id,pre:c.char,pick:st.bad[s.id]?"":pick,kind:s.kind||null,pre_conf:s.pre_conf||null});
  }
  return {page:pi,cards,items,secs:takeSecs()};
}
function render(){
  st.page=Math.min(Math.max(0,st.page),NP-1);
  const L=$("list");L.textContent="";
  for(const c of D.cards.slice(st.page*P,(st.page+1)*P)){
    const box=document.createElement("div");box.className="card";
    const hd=document.createElement("div");hd.className="cardhead";
    const big=document.createElement("div");big.className="big";big.textContent=c.char;
    const inp=document.createElement("input");inp.type="text";inp.maxLength=2;inp.value=st.pick[c.char]||"";inp.placeholder="改字";inp.title="预选字不对就在这里改成对的字";inp.setAttribute("aria-label","改字");
    inp.oninput=()=>{if(inp.value)st.pick[c.char]=inp.value;else delete st.pick[c.char];lsSet(KEY,st)};
    const meta=document.createElement("div");meta.className="stat";meta.textContent=`共 ${c.n} 格，看 ${c.samples.length} 格，其余 ${c.followers.length} 格跟随`;
    const tg=document.createElement("div");tg.className="tags";for(const k of c.kinds){const t=document.createElement("span");t.className="tag";t.textContent=D.kind_names[k]||k;tg.appendChild(t)}
    hd.append(big,inp,meta,tg);
    const g=document.createElement("div");g.className="tiles";
    for(const s of c.samples){
      const b=document.createElement("button");b.className="tile"+(st.bad[s.id]?" bad":"");b.title=s.id;
      const w=document.createElement("div");w.className="img";const im=document.createElement("img");im.src=s.img||"";im.alt=c.char;w.appendChild(im);
      const m=document.createElement("div");m.className="m";m.textContent=(s.pre_conf||"")+(s.kind?" · "+(D.kind_names[s.kind]||s.kind):"");
      b.append(w,m);b.onclick=()=>{if(st.bad[s.id])delete st.bad[s.id];else st.bad[s.id]=1;lsSet(KEY,st);b.classList.toggle("bad")};g.appendChild(b);
    }
    box.append(hd,g);L.appendChild(box);
  }
  $("pg").textContent=`第 ${st.page+1} / ${NP} 页`;
  $("sub").textContent=`册 ${D.book} · ${D.cards.length} 张卡 · ${D.n_cells} 格 · 模板 ${D.tpl_version}`;
  $("stat").textContent=`已审 ${st.seen}/${NP} 页`;$("bar").style.width=(st.seen/NP*100)+"%";
  $("hint").textContent="每张卡是同一个预选字的几个样例，默认全对。样例里有不对的点它（变红）；字整体不对就在卡头框里改字。样例里有红格的卡，其余跟随格不放，退回逐格审。";
  for(const id of ["prev","prev2"])$(id).disabled=st.page===0;
  for(const id of ["next","next2"])$(id).textContent=st.page===NP-1?"本页没问题，完成":"本页没问题，下一页";
  lsSet(KEY,st);
}
function next(){saveDoc("c_b"+D.book+"_p"+st.page,pageDoc(st.page));st.seen=Math.max(st.seen,st.page+1);if(st.page<NP-1)st.page++;else showOut({book:D.book,pages_seen:st.seen,pick:st.pick,bad:Object.keys(st.bad)});render();scrollTo(0,0)}
for(const id of ["next","next2"])$(id).onclick=next;
for(const id of ["prev","prev2"])$(id).onclick=()=>{st.page--;render();scrollTo(0,0)};
$("export").onclick=()=>showOut({book:D.book,pages_seen:st.seen,pick:st.pick,bad:Object.keys(st.bad)});
wireDlg();render();initDB();
</script>
