<title>一字一卡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*COMMON_CSS*/
.cardhead{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.big{font:600 40px/1 var(--font-glyph);min-width:1.3em;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cardhead input{width:3.2em;font:600 22px/1 var(--font-glyph);text-align:center}
.tile .sug{font:600 30px/1 var(--font-glyph)}
.tile .m b{font-weight:600}
.tile.v-seg{border-color:#b7791f}.tile.v-unclear{border-color:var(--muted);border-style:dashed}
.tile.v-other{border-color:var(--bad);background:var(--bad-bg)}.tile.v-ok{border-color:var(--ok)}
.tile .pk{width:3em;font:600 20px/1 var(--font-glyph);text-align:center}
.tile .ctx{font:13px/1.4 var(--font-glyph);color:var(--fg);text-align:center;word-break:break-all;max-width:100%}
.tile .note{font-size:11px;color:var(--muted);text-align:left;max-width:100%;line-height:1.35}
.tile .cs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tile .cand{font:600 18px/1 var(--font-glyph);padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:2.2em}
.tile .cand small{font:10px/1.2 var(--font-ui);color:var(--muted)}.tile .cand.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}.tile .cand.sel small{color:var(--accent-fg)}
.tiles.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tile .acts{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.tile .acts button{font-size:12px;padding:3px 6px}
.tile .acts button.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.tile .ids{width:8em;font:16px/1 var(--font-glyph);text-align:center}
.tile .flag{font-size:11px;color:var(--bad);border:1px solid var(--bad);border-radius:4px;padding:1px 4px}
.tile .img .noimg{display:flex;align-items:center;justify-content:center;width:96px;height:96px;box-sizing:border-box;padding:4px;text-align:center;background:#eee;color:#777;border:1px solid #ccc;border-radius:3px;font:11px/1.3 var(--font-ui)}.tile .img.pair{gap:4px}.tile .img.pair figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}.tile .img.pair figcaption{font:10px var(--font-ui);color:var(--muted)}.tile .img.pair .refimg{border:1px dashed var(--muted);border-radius:3px;padding:1px}
.hard main,.hard .hint{max-width:1500px}
.hard #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;align-items:start}
.hard #list .card{margin:0;padding:6px 8px;min-width:0}
.hard .cardhead{margin-bottom:4px;gap:6px}.hard .big{font-size:24px;min-width:1.1em}
.hard .cardhead .stat{font-size:10px;word-break:break-all;flex:1 1 100px}.hard .cardhead .tags{flex-basis:100%}
.hard .tile .pk,.hard .tile .ids{width:92%;box-sizing:border-box;font-size:18px;text-align:center}.hard .tile input::placeholder{font-size:12px}
.hard .tile .ctx{font-size:12px}
.colwrap{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin:6px 0}.tile .colwrap img.colimg,.tile .nb img.colimg{height:150px;width:auto;max-height:none;max-width:none;flex:none;object-fit:contain;border:1px solid var(--border,#ccc);background:#fff}.nb figure{margin:6px 0}.nb figcaption{font-size:11px;color:var(--muted,#666)}.nb summary{cursor:pointer;font-size:12px}label.nl{display:block;font-size:12px;margin-top:6px;color:var(--muted,#555)}.hard .tile .note{font-size:10px}@media(max-width:700px){.hard .tile{display:flex;flex-direction:column}.hard .tile>*{order:5}.hard .tile>.sug,.hard .tile>.img{order:0}.hard .tile>.m,.hard .tile>.pk{order:1}.hard .tile>.ctx{order:2}.hard .tile>.cs{order:3}.hard .tile>.acts,.hard .tile>.ids{order:4}.hard .tile>.nl,.hard .tile>.note{order:6}.hard .tile>.colwrap{order:7}.tile .colwrap img.colimg,.tile .nb img.colimg{height:140px}.tile .colwrap img.colimg.big,.tile .nb img.colimg.big{height:420px}}.colimg{cursor:zoom-in}.hard .tile .sug{font-size:22px}
.nofont{font:600 10px/1.2 var(--font-ui);color:var(--muted)}
/*FONT_CSS*/
.tile.v-notchar{border-color:#b7791f;border-style:dashed}.tile.v-unknown{border-color:var(--muted)}
</style>
/*SHELL*/
<script>
const D=/*DATA*/null;
/*COMMON_JS*/
// 每页 per_page 张卡。逐格点击循环：1 切分有问题 → 2 改字（格下出输入框，不预填）→ 3 看不清 → 4 对 → 5 取消。
// 每点一下只把这一格写进 db（集合 D.coll，文档 c_<格号>），不整页重发布；「本页其余都对」时没点的样例记对。
// 已录入的格出页前由 build --exclude 撤掉，页面上不再出现。
const KEY="char-card-"+D.book+"-"+D.tpl_version.split(".").slice(0,2).join("."), P=D.per_page, NP=Math.max(1,Math.ceil(D.cards.length/P));
const CYC=["seg","other","unclear","ok"], VN={seg:"切分有问题",other:"改字",unclear:"看不清",ok:"对",notchar:"不是字",unknown:"认不出"};
// 难认字页（rest_ok=false，1.4 起）：一格一卡、不合卡、没有卡头改字；格上直接给「页上字对／切分有问题／不是字／看不清／认不出」按钮，
// 认不出可填部件（如 亻火又），存成 unknown:<部件>；格带 seg_hint（字形线判切分）、recut（按新切分重裁过）时标出。
const HARD=D.rest_ok===false;if(HARD)document.body.classList.add("hard");
const NOF=new Set(D.nofont||[]);const gl=ch=>NOF.has(ch)?"U+"+ch.codePointAt(0).toString(16).toUpperCase():ch;
function lsRaw(k){try{const x=localStorage.getItem(k);return x?JSON.parse(x):null}catch(e){return null}}
let st=lsRaw(KEY)||lsRaw("char-card-"+D.book+"-1.5")||lsRaw("char-card-"+D.book+"-1.4")||lsRaw("char-card-"+D.book+"-1.3")||lsRaw("char-card-"+D.book+"-1.2")||lsRaw("char-card-"+D.book+"-1.1.0")||{};
st=Object.assign({v:{},pick:{},pickT:{},seen:0,page:0,nl:{}},st);st.nl=st.nl||{};st.pickT=st.pickT||{};for(const k in st.pick)if(!st.pickT[k])st.pickT[k]=Date.now();
const savedT={}, savedK={};
const cellVal=(c,id)=>{const x=st.v[id];if(!x)return null;if(x.v==="unknown")return "unknown"+(x.pk?":"+x.pk:"");return x.v==="other"?(x.pk?"pick:"+x.pk:"other"):x.v==="ok"?"pick:"+(st.pick[c.char]||c.char):x.v};
function setNL(c,id,on){ // 1.6：「不入库」勾选＝定字照记人裁，但事件带 no_glyph_lib（route／glyphdb_admit 跳过）
  if(on)st.nl[id]=1;else delete st.nl[id];if(st.v[id])st.v[id].t=Date.now();lsSet(KEY,st);queueSave()}
function setCell(c,id,v,pk){
  if(v)st.v[id]={v,pk:pk||"",t:Date.now()};else delete st.v[id];
  lsSet(KEY,st);queueSave();
  if(HARD){const done=D.cards.reduce((a,c)=>a+c.samples.filter(s=>st.v[s.id]).length,0);$("stat").textContent=`已标 ${done}/${D.n_cells} 格`;$("bar").style.width=(done/Math.max(1,D.n_cells)*100)+"%"}
}
let timer=null,inflight=false;
function queueSave(){if(!DB){setSync("未联网存档（只存在本浏览器）");return}clearTimeout(timer);timer=setTimeout(flush,1200)}
async function flush(){
  if(!DB||inflight)return;inflight=true;
  try{
    for(const c of D.cards)for(const s of c.samples){
      const id=s.id,x=st.v[id],had=savedT[id]||0,ref=DB.doc(D.coll+"/c_"+safeId(id));
      if(x&&x.t!==had){await ref.set(Object.assign({page_type:TPL.type,tpl_version:TPL.version,book:D.book,id,card:c.char,v:cellVal(c,id),t:x.t},st.nl[id]?{no_glyph_lib:true}:{}));savedT[id]=x.t}
      else if(!x&&had){await ref.delete();delete savedT[id]}
    }
    // 卡头改字（整卡都是这个字）也每改即存：文档 k_<卡字>
    for(const c of D.cards){
      const k=c.char,t=st.pickT[k]||0,had=savedK[k]||0,ref=DB.doc(D.coll+"/k_"+safeId(k));
      if(st.pick[k]&&t!==had){await ref.set({page_type:TPL.type,tpl_version:TPL.version,book:D.book,card:k,pick:st.pick[k],ids:c.samples.map(s=>s.id).concat(c.followers),t});savedK[k]=t}
      else if(!st.pick[k]&&had){await ref.delete();delete savedK[k]}
    }
    setSync("已存后台");
  }catch(e){setSync("后台存档失败，重试中："+(e.code||e.message));timer=setTimeout(flush,8000)}
  finally{inflight=false}
}
addEventListener("visibilitychange",()=>{if(document.hidden)flush()});addEventListener("pagehide",flush);
function pageDoc(pi){
  const cs=D.cards.slice(pi*P,(pi+1)*P), items=[], cards=[];
  for(const c of cs){
    const pick=st.pick[c.char]||c.char, bad=c.samples.filter(s=>{const v=cellVal(c,s.id);return v&&v!=="pick:"+pick}).map(s=>s.id);
    cards.push({char:c.char,pick,bad,n:c.n,cells:Object.fromEntries(c.samples.map(s=>[s.id,cellVal(c,s.id)||"pick:"+pick]))});
    for(const s of c.samples){const v=cellVal(c,s.id)||"pick:"+pick;items.push({id:s.id,pre:c.char,pick:v.startsWith("pick:")?v.slice(5):"",v,kind:s.kind||null,pre_conf:s.pre_conf||null})}
  }
  return {page:pi,cards,items,secs:takeSecs()};
}
function paint(b,c,s){
  const x=st.v[s.id];b.className="tile"+(x?" v-"+x.v:"");
  for(const e of b.querySelectorAll(".acts button"))e.classList.toggle("sel",!!(x&&x.v===e.dataset.v));
  const ids=b.querySelector(".ids");if(ids){ids.hidden=HARD?false:!(x&&x.v==="unknown");if(!ids.hidden&&document.activeElement!==ids)ids.value=(x&&x.v==="unknown"&&x.pk)||""}
  b.querySelector(".m").textContent=x?(x.v==="other"?"改字"+(x.pk?"："+x.pk:""):x.v==="unknown"?"认不出"+(x.pk?"："+x.pk:""):VN[x.v]):((s.pre_conf||"")+(s.kind?" · "+(D.kind_names[s.kind]||s.kind):""));
  for(const e of b.querySelectorAll(".cand"))e.classList.toggle("sel",!!(x&&x.v==="other"&&x.pk===e.dataset.ch));
  const inp=b.querySelector(".pk");inp.hidden=HARD?false:!(x&&x.v==="other");if(!inp.hidden&&document.activeElement!==inp)inp.value=(x&&x.v==="other"&&x.pk)||"";
}
const s0=c=>c.samples[0]||{id:""};
function render(){
  st.page=Math.min(Math.max(0,st.page),NP-1);
  const L=$("list");L.textContent="";
  for(const c of D.cards.slice(st.page*P,(st.page+1)*P)){
    const box=document.createElement("div");box.className="card";
    const hd=document.createElement("div");hd.className="cardhead";
    const big=document.createElement("div");big.className="big";big.textContent=gl(c.char);if(NOF.has(c.char))big.classList.add("nofont");
    const inp=document.createElement("input");inp.type="text";inp.maxLength=2;inp.value=st.pick[c.char]||"";inp.placeholder="改字";inp.title="整卡的建议字都不对就在这里改成对的字";inp.setAttribute("aria-label","整卡改字");
    inp.oninput=()=>{const v=inp.value.trim();if(v)st.pick[c.char]=v;else delete st.pick[c.char];st.pickT[c.char]=Date.now();lsSet(KEY,st);queueSave()};
    const meta=document.createElement("div");meta.className="stat";meta.textContent=`共 ${c.n} 格，看 ${c.samples.length} 格，其余 ${c.followers.length} 格跟随`;
    const tg=document.createElement("div");tg.className="tags";for(const k of c.kinds){const t=document.createElement("span");t.className="tag";t.textContent=D.kind_names[k]||k;tg.appendChild(t)}
    if(HARD){meta.textContent=s0(c).id;hd.append(big,meta,tg)}else hd.append(big,inp,meta,tg);
    const g=document.createElement("div");g.className="tiles"+(c.samples.some(s=>s.ctx||s.note||(s.cands&&s.cands.length))?" wide":"");
    for(const s of c.samples){
      const b=document.createElement("div");b.setAttribute("role","button");b.tabIndex=0;b.title=s.id;
      const sg=document.createElement("div");sg.className="sug";sg.textContent=gl(c.char);if(NOF.has(c.char))sg.classList.add("nofont");
      const w=document.createElement("div");w.className="img";let im;if(s.img){im=document.createElement("img");im.src=s.img;im.alt=c.char}else{im=document.createElement("div");im.className="noimg";im.textContent="本书无切图（没对上 v2）"}
      if(s.ref_img){ // 1.5：标准字形图（如维基 SKQS）与本书切图并排，各带一行小字
        w.classList.add("pair");const fb=document.createElement("figure"),fr=document.createElement("figure");
        const rm=document.createElement("img");rm.src=s.ref_img;rm.alt="标准字形";rm.className="refimg";
        const cb=document.createElement("figcaption");cb.textContent="本书";const cr=document.createElement("figcaption");cr.textContent=s.ref_label||"标准";
        fb.append(im,cb);fr.append(rm,cr);w.append(fb,fr)}else w.appendChild(im);
      const cw=document.createElement("div");cw.className="colwrap";
      if(s.col_img){const ci=document.createElement("img");ci.src=s.col_img;ci.className="colimg";ci.alt="整列图";ci.title="整列图，红框是本格；点一下放大／缩小";ci.onclick=e=>{e.stopPropagation();ci.classList.toggle("big")};cw.append(ci)}
      if(s.nb_imgs&&s.nb_imgs.length){const dt=document.createElement("details");dt.className="nb";const sm=document.createElement("summary");sm.textContent="看左右邻列";dt.append(sm);
        for(const n of s.nb_imgs){const fg=document.createElement("figure");const ni=document.createElement("img");ni.src=n.img;ni.className="colimg";ni.onclick=e=>{e.stopPropagation();ni.classList.toggle("big")};const fc=document.createElement("figcaption");fc.textContent=n.label||"";fg.append(ni,fc);dt.append(fg)}
        dt.onclick=e=>e.stopPropagation();cw.append(dt)}
      const nlb=document.createElement("label");nlb.className="nl";const nlc=document.createElement("input");nlc.type="checkbox";nlc.checked=!!st.nl[s.id];
      nlc.onclick=e=>{e.stopPropagation();setNL(c,s.id,nlc.checked)};nlc.onkeydown=e=>e.stopPropagation();nlb.onclick=e=>e.stopPropagation();nlb.append(nlc,document.createTextNode(" 不入库（定字，但这张图不进字形库，如污渍多）"));
      const m=document.createElement("div");m.className="m";
      const pk=document.createElement("input");pk.type="text";pk.className="pk";pk.maxLength=2;pk.placeholder=HARD?"这格是（直接输入字）":"这格是";pk.setAttribute("aria-label","这格是什么字");
      pk.onclick=e=>e.stopPropagation();pk.onkeydown=e=>e.stopPropagation();
      pk.oninput=()=>{setCell(c,s.id,"other",pk.value.trim());paint(b,c,s)};
      const cx=document.createElement("div");cx.className="ctx";cx.textContent=s.ctx||"";
      const nt=document.createElement("div");nt.className="note";nt.textContent=s.note||"";
      // 多路候选（字体、OCR、库前五、参校本、IDS 检索……）：点一下＝这格改成该字；小字是来源
      const cs=document.createElement("div");cs.className="cs";
      for(const cd of s.cands||[]){
        const [ch,src]=Array.isArray(cd)?cd:[cd.ch,cd.src];if(!ch)continue;
        const bt=document.createElement("button");bt.type="button";bt.className="cand";bt.dataset.ch=ch;bt.title=src?"来源："+src:"";
        bt.append(document.createTextNode(gl(ch)));if(NOF.has(ch))bt.classList.add("nofont");if(src){const sm=document.createElement("small");const st_=Array.isArray(src)?src.join("、"):src;
          // 难认字页：来源串太长，只显示命中几路（＋末尾分数），全串在悬停提示里
          if(HARD){const n=st_.split(/[·、；]/).filter(x=>x.trim()&&!/^[0-9. ]+$/.test(x)).length,sc=(st_.match(/ ([0-9.]+)$/)||[])[1];sm.textContent=n+" 路"+(sc?" "+sc:"")}else sm.textContent=st_;bt.appendChild(sm)}
        bt.onclick=e=>{e.stopPropagation();const x=st.v[s.id];if(x&&x.v==="other"&&x.pk===ch)setCell(c,s.id,null);else setCell(c,s.id,"other",ch);paint(b,c,s)};
        bt.onkeydown=e=>e.stopPropagation();cs.appendChild(bt);
      }
      b.append(sg,w,m,pk);
      if(s.seg_hint||s.recut){const fl=document.createElement("div");fl.className="cs";
        for(const t of [s.seg_hint&&("疑似切分："+s.seg_hint),s.recut&&("已按新切分重裁"+(s.recut===true?"":"："+s.recut))].filter(Boolean)){const e=document.createElement("span");e.className="flag";e.textContent=t;fl.appendChild(e)}
        b.append(fl)}
      if(cw.childNodes.length)b.append(cw);if(s.ctx)b.append(cx);if(cs.childNodes.length)b.append(cs);b.append(nlb);
      if(HARD){
        const ac=document.createElement("div");ac.className="acts";
        for(const [v,t] of [["ok","页上字对"],["seg","切分有问题"],["notchar","不是字"],["unclear","看不清"],["unknown","认不出"]]){
          const bt=document.createElement("button");bt.type="button";bt.dataset.v=v;bt.textContent=t;bt.onkeydown=e=>e.stopPropagation();
          bt.onclick=e=>{e.stopPropagation();const x=st.v[s.id];if(x&&x.v===v)setCell(c,s.id,null);else setCell(c,s.id,v,"");paint(b,c,s);if(v==="unknown")ids.focus()};
          ac.appendChild(bt)}
        const ids=document.createElement("input");ids.type="text";ids.className="ids";ids.placeholder="认不出：写部件或 IDS";ids.hidden=true;ids.setAttribute("aria-label","认不出：能看出的部件");
        ids.onclick=e=>e.stopPropagation();ids.onkeydown=e=>e.stopPropagation();
        ids.oninput=()=>{setCell(c,s.id,"unknown",ids.value.trim());paint(b,c,s)};
        b.append(ac,ids)}
      if(s.note)b.append(nt);
      const cyc=()=>{const x=st.v[s.id],i=x?CYC.indexOf(x.v):-1,nv=CYC[i+1]||null;setCell(c,s.id,nv,nv==="other"?(x&&x.pk)||"":"");paint(b,c,s);if(nv==="other")pk.focus()};
      if(HARD)b.onclick=null;else b.onclick=cyc;if(!HARD)b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();cyc()}};
      paint(b,c,s);g.appendChild(b);
    }
    box.append(hd,g);L.appendChild(box);
  }
  $("pg").textContent=`第 ${st.page+1} / ${NP} 页`;
  $("sub").textContent=`册 ${D.book} · ${D.cards.length} 张卡 · ${D.n_cells} 格 · 模板 ${D.tpl_version}`+(D.n_excluded?` · 已录入撤出 ${D.n_excluded} 格`:"");
  $("stat").textContent=`已审 ${st.seen}/${NP} 页`;$("bar").style.width=(st.seen/NP*100)+"%";
  $("hint").textContent="每张卡是同一个建议字的几个样例。点格子循环：1 切分有问题 → 2 改字（在格下填这格是什么字）→ 3 看不清 → 4 对 → 再点取消。每点一下就存后台。点「本页其余都对」时没点的样例记对；整卡都不是这个字就在卡头框里改字。样例有不对的卡，其余跟随格不放，退回逐格审。";
  for(const id of ["prev","prev2"])$(id).disabled=st.page===0;
  if(D.rest_ok===false){
    for(const id of ["next","next2"])$(id).textContent=st.page===NP-1?"保存已改的格":"保存已改，下一页";
    $("hint").textContent="难认字页：一格一张卡，没点的格不算对。点候选＝改成该字，或在格下框里填字；也可点「页上字对／切分有问题／不是字／看不清／认不出」，认不出可填能看出的部件（如 亻火又）。每点一下就存后台，页顶显示「已存后台」即可；按钮只是再存一遍、翻页。";
    const done=D.cards.reduce((a,c)=>a+c.samples.filter(s=>st.v[s.id]).length,0);$("stat").textContent=`已标 ${done}/${D.n_cells} 格`;$("bar").style.width=(done/Math.max(1,D.n_cells)*100)+"%";
  }else for(const id of ["next","next2"])$(id).textContent=st.page===NP-1?"本页其余都对，完成":"本页其余都对，下一页";
  lsSet(KEY,st);
}
function next(){if(D.rest_ok===false){clearTimeout(timer);flush();st.seen=Math.max(st.seen,st.page+1);if(st.page<NP-1)st.page++;render();scrollTo(0,0);return}saveDoc("c_b"+D.book+"_p"+st.page,pageDoc(st.page));st.seen=Math.max(st.seen,st.page+1);if(st.page<NP-1)st.page++;else showOut({book:D.book,pages_seen:st.seen,pick:st.pick,cells:st.v});render();scrollTo(0,0)}
for(const id of ["next","next2"])$(id).onclick=next;
for(const id of ["prev","prev2"])$(id).onclick=()=>{st.page--;render();scrollTo(0,0)};
$("export").onclick=()=>showOut({book:D.book,pages_seen:st.seen,pick:st.pick,cells:st.v});
wireDlg();render();
initDB(async()=>{
  // 从后台恢复逐格结果（换设备、清缓存后不丢）
  const snap=await DB.collection(D.coll).get();let ch=false;
  for(const d of snap.docs){
    const x=d.data();
    if(x&&d.id.startsWith("k_")&&x.card){savedK[x.card]=x.t||0;if((st.pickT[x.card]||0)<(x.t||0)){st.pick[x.card]=x.pick;st.pickT[x.card]=x.t||0;ch=true}continue}
    if(!x||!d.id.startsWith("c_")||!x.id||!x.v)continue;
    savedT[x.id]=x.t||0;
    if(st.v[x.id]&&(st.v[x.id].t||0)>=(x.t||0))continue;
    if(x.v.startsWith("unknown")){st.v[x.id]={v:"unknown",pk:x.v.slice(8),t:x.t||0};ch=true;continue}
    const v=x.v.startsWith("pick:")?(x.v.slice(5)===x.card?"ok":"other"):x.v;
    st.v[x.id]={v,pk:v==="other"&&x.v.startsWith("pick:")?x.v.slice(5):"",t:x.t||0};ch=true;
  }
  if(ch){lsSet(KEY,st);render()}
  setSync("已连后台");
  if(Object.keys(st.v).some(id=>st.v[id].t!==(savedT[id]||0))||Object.keys(st.pick).some(k=>(st.pickT[k]||0)!==(savedK[k]||0)))queueSave();
});
</script>
