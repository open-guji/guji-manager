<title>码位定夺</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*COMMON_CSS*/
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:6px}
.no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pt{font:600 24px/1.2 var(--font-glyph);letter-spacing:.06em}.pt span{color:var(--muted);font-size:16px;margin:0 4px}
.sug{font-size:12px;color:var(--accent);border:1px dashed var(--accent);border-radius:4px;padding:0 8px}
.row{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.lab{display:flex;align-items:center;gap:8px}.lab .g{font:30px/1 var(--font-glyph);width:36px;text-align:center}
.lab .n{font-size:11px;line-height:1.4;color:var(--muted);font-variant-numeric:tabular-nums}
.thumbs{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.thumbs img{height:60px;width:auto;border-radius:3px;border:1px solid var(--line);background:#fff}
.empty{color:var(--muted);font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.opt{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:5px 10px}
.opt .s{font:600 17px var(--font-glyph)}
.opt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.other{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.other input{width:3em;font:18px var(--font-glyph);text-align:center}
.other.on{border-color:var(--accent)}
.card.todo{border-color:var(--bad)}
@media(max-width:520px){.row{grid-template-columns:1fr}.thumbs img{height:52px}}
</style>
/*SHELL*/
<script>
const D=/*DATA*/null;
/*COMMON_JS*/
const KEY="cp-"+D.book+"-"+D.tpl_version, P=D.per_page, NP=Math.max(1,Math.ceil(D.groups.length/P));
let st=lsGet(KEY,{pick:{},note:{},seen:0,page:0});
const picked=g=>st.pick[g.key]??g.pre??null;
const cpHex=c=>"U+"+c.codePointAt(0).toString(16).toUpperCase();
const nf=n=>(n||0).toLocaleString("en-US");
function pageGroups(pi){return D.groups.slice(pi*P,(pi+1)*P)}
function pageDoc(pi){
  const items=pageGroups(pi).map(g=>({id:g.key,chars:g.chars,pre:g.pre??null,pick:picked(g),note:st.note[g.key]||""}));
  return {page:pi,items,secs:takeSecs()};
}
function setPick(g,v){st.pick[g.key]=v;lsSet(KEY,st);render()}
function opt(g,v,label,glyph){
  const b=document.createElement("button");b.className="opt"+(picked(g)===v?" on":"");b.type="button";
  b.append(label);if(glyph){const s=document.createElement("span");s.className="s";s.textContent=glyph;b.append(s)}
  b.onclick=()=>setPick(g,v);return b;
}
function render(){
  st.page=Math.min(Math.max(0,st.page),NP-1);
  const L=$("list");L.textContent="";
  pageGroups(st.page).forEach((g,j)=>{
    const n=st.page*P+j, v=picked(g);
    const box=document.createElement("section");box.className="card"+(v?"":" todo");
    const ph=document.createElement("div");ph.className="ph";
    const no=document.createElement("span");no.className="no";no.textContent=`${n+1} / ${D.groups.length}`;
    const pt=document.createElement("span");pt.className="pt";
    g.chars.forEach((c,i)=>{if(i){const s=document.createElement("span");s.textContent="／";pt.append(s)}pt.append(c)});
    ph.append(no,pt);
    if(g.pre||g.hint){const s=document.createElement("span");s.className="sug";s.textContent=(g.pre?"预选："+label(g.pre):"")+(g.hint?(g.pre?"　":"")+g.hint:"");ph.append(s)}
    box.append(ph);
    for(const ch of g.chars){
      const r=(g.rows||{})[ch]||{};
      const row=document.createElement("div");row.className="row";
      const lab=document.createElement("div");lab.className="lab";
      const gg=document.createElement("span");gg.className="g";gg.textContent=ch;
      const nn=document.createElement("span");nn.className="n";
      nn.append(cpHex(ch));
      if(r.adm!=null){nn.append(document.createElement("br"),"已认 "+nf(r.adm))}
      if(r.kr!=null){nn.append(document.createElement("br"),"整理本 "+nf(r.kr))}
      lab.append(gg,nn);
      const t=document.createElement("div");t.className="thumbs";
      for(const [id,img] of (r.tiles||[])){const im=new Image();im.src=img;im.alt=ch;im.loading="lazy";
        im.title="册"+String(id).replace(/^(\d+):(\d+):(\d+):(\d+)$/,"$1 页$2 列$3 字$4");t.append(im)}
      if(!(r.tiles||[]).length){const e=document.createElement("span");e.className="empty";e.textContent="本书没有认成这个字的格";t.append(e)}
      row.append(lab,t);box.append(row);
    }
    const op=document.createElement("div");op.className="opts";
    for(const ch of g.chars)op.append(opt(g,"unify:"+ch,"统一作 ",ch));
    op.append(opt(g,"split_follow","分开·互认"),opt(g,"split_distinct","分开·不同字"));
    const w=document.createElement("label");const isOther=v&&v.startsWith("other:");w.className="other"+(isOther?" on":"");
    w.append("合并到别的字");const inp=document.createElement("input");inp.type="text";inp.maxLength=2;inp.setAttribute("aria-label","合并到的字");
    if(isOther)inp.value=v.slice(6);
    inp.onchange=()=>{const c=[...inp.value.trim()][0];if(c)setPick(g,(g.chars.includes(c)?"unify:":"other:")+c)};
    w.append(inp);op.append(w);
    const nt=document.createElement("input");nt.type="text";nt.placeholder="备注";nt.value=st.note[g.key]||"";
    nt.oninput=()=>{st.note[g.key]=nt.value;lsSet(KEY,st)};op.append(nt);
    box.append(op);L.appendChild(box);
  });
  const todo=pageGroups(st.page).filter(g=>!picked(g)).length;
  $("pg").textContent=`第 ${st.page+1} / ${NP} 页`;
  $("sub").textContent=`${D.book} · ${D.groups.length} 组 · 模板 ${D.tpl_version}`;
  $("stat").textContent=`已审 ${st.seen}/${NP} 页`;$("bar").style.width=(st.seen/NP*100)+"%";
  $("hint").textContent=D.hint||"每组看各字的原书字块，选一项：统一作某字（刻法一样）／分开·互认（两种刻法都记，整理本作另一形也照刻形放）／分开·不同字（不是一个字，照刻形，不互认）／合并到别的字（填组外字）。有预选的已选好，不同意就改；红框是还没选的。";
  for(const id of ["prev","prev2"])$(id).disabled=st.page===0;
  for(const id of ["next","next2"]){$(id).disabled=todo>0;$(id).textContent=todo?`还有 ${todo} 组没选`:(st.page===NP-1?"本页没问题，完成":"本页没问题，下一页")}
  lsSet(KEY,st);
}
function label(v){if(!v)return"";if(v.startsWith("unify:"))return"统一作 "+v.slice(6);if(v.startsWith("other:"))return"合并到 "+v.slice(6);
  return v==="split_follow"?"分开·互认":v==="split_distinct"?"分开·不同字":v}
function exportAll(){return {book:D.book,pages_seen:st.seen,items:D.groups.slice(0,st.seen*P).map(g=>({id:g.key,chars:g.chars,pre:g.pre??null,pick:picked(g),note:st.note[g.key]||""}))}}
function next(){saveDoc("cp_b"+D.book+"_p"+st.page,pageDoc(st.page));st.seen=Math.max(st.seen,st.page+1);if(st.page<NP-1)st.page++;else showOut(exportAll());render();scrollTo(0,0)}
for(const id of ["next","next2"])$(id).onclick=next;
for(const id of ["prev","prev2"])$(id).onclick=()=>{st.page--;render();scrollTo(0,0)};
$("export").onclick=()=>showOut(exportAll());
wireDlg();render();initDB();
</script>
