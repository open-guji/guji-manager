<title>标点抽样验收</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*COMMON_CSS*/
.para{font:16px/1.9 var(--font-glyph)}.opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.opts label{border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}.opts label.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.opts input[type=radio]{margin-right:4px}
</style>
/*SHELL*/
<script>
const D=/*DATA*/null;
/*COMMON_JS*//*PAGER_JS*/
// 每项一个自然段（带标点），抽样点号高亮；判对/错/存疑；错时记「应改标点」「位置」
const VERD=D.options;
makePager({key:"punct",prefix:"u",all:D.groups.map(g=>Object.assign({id:g.key},g)),per:D.per_page,
  hintText:D.hint||"高亮处是抽样的标点：对就不用动；错了选「错」，填应改成的标点和位置（该点号在段内第几个字）。",
  stats:(done,V)=>{const bad=done.filter(g=>(V(g.id).pick||g.pre)==="错").length;return `错 ${bad}/${done.length}（${done.length?(bad/done.length*100).toFixed(1):"0.0"}%）· 共 ${D.groups.length} 处`},
  draw(g,box,v,save){
    const hd=document.createElement("div");hd.className="stat";hd.textContent=`${g.key} · 册 ${g.vol||"?"} · 段 ${g.para||"?"} · 点号位置 ${g.anchor??"?"}`;
    const pa=document.createElement("div");pa.className="para";const t=g.text||(g.lines||[]).join("\n");const a=g.anchor;hl(pa,t,null,a!=null?[a,a+1]:null);
    const op=document.createElement("div");op.className="opts";const fx=document.createElement("input");fx.type="text";fx.size=4;fx.placeholder="应改标点";fx.value=v.fix||"";fx.oninput=()=>{v.fix=fx.value;save()};
    const ps=document.createElement("input");ps.type="text";ps.size=5;ps.placeholder="位置";ps.value=v.pos??(a!=null?String(a):"");ps.oninput=()=>{v.pos=ps.value;save()};
    const show=()=>{fx.style.display=ps.style.display=(v.pick||g.pre)==="错"?"":"none"};
    for(const o of VERD){const lb=document.createElement("label");const r=document.createElement("input");r.type="radio";r.name="u_"+g.key;r.checked=(v.pick||g.pre)===o;lb.className=r.checked?"sel":"";lb.append(r,o);
      r.onchange=()=>{v.pick=o;save();for(const l of op.querySelectorAll("label"))l.className="";lb.className="sel";show()};op.appendChild(lb)}
    const nt=document.createElement("input");nt.type="text";nt.placeholder="备注";nt.value=v.note||"";nt.oninput=()=>{v.note=nt.value;save()};op.append(fx,ps,nt);
    box.append(hd,pa,op);show();
  },
  doc(g,v){const p=v.pick||g.pre;return {id:g.key,key:g.key,pre:g.pre,pick:p,vol:g.vol||null,para:g.para??null,anchor:g.anchor??null,fix:p==="错"?(v.fix||""):"",pos:p==="错"?(v.pos??(g.anchor!=null?String(g.anchor):"")):"",note:v.note||""}}});
</script>
