<title>库无专名建档确认</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*COMMON_CSS*/
.gk{font:600 24px/1.2 var(--font-glyph)}.lines{font:15px/1.7 var(--font-glyph);margin:6px 0}.lines div{border-left:3px solid var(--line);padding-left:8px;margin:2px 0}
.opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.opts label{border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.opts label.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}.opts input[type=radio]{margin-right:4px}
.flag{color:var(--bad);border-color:var(--bad)}select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px}
</style>
/*SHELL*/
<script>
const D=/*DATA*/null;
/*COMMON_JS*//*PAGER_JS*/
makePager({key:"namereg",prefix:"r",all:D.groups.map(g=>Object.assign({id:g.key},g)),per:D.per_page,filterKey:"type",filters:[...new Set(D.groups.map(x=>x.type).filter(Boolean))],
  hintText:D.hint||"每组一个库里没有的专名：看出处句，定建档、并入已有实体（填目标 id）、不建。书名/出版者组会转 A11/A12。",
  draw(g,box,v,save){
    const pick=()=>v.pick||g.pre||"不确定";
    const hd=document.createElement("div");hd.className="gk";hd.textContent=g.std_name||g.key;
    const tg=document.createElement("div");tg.className="tags";
    for(const t of [g.type,g.dynasty,"出现 "+(g.n||(g.lines||[]).length)+" 次"].filter(Boolean)){const e=document.createElement("span");e.className="tag";e.textContent=t;tg.appendChild(e)}
    if(g.route_to){const e=document.createElement("span");e.className="tag flag";e.textContent="转 "+g.route_to;tg.appendChild(e)}
    if(g.src_url){const a=document.createElement("a");a.href=g.src_url;a.target="_blank";a.rel="noopener";a.textContent="来源链接";a.className="tag";tg.appendChild(a)}
    const ln=document.createElement("div");ln.className="lines";
    for(const t of (g.lines||[]).slice(0,8)){const d=document.createElement("div");hl(d,t,g.name||g.std_name||g.key);ln.appendChild(d)}
    const op=document.createElement("div");op.className="opts";
    const tgt=document.createElement("select");tgt.setAttribute("aria-label","并入的实体");
    for(const c of [{id:"",name:"选择目标实体"},...(g.cands||[])]){const o=document.createElement("option");o.value=c.id;o.textContent=c.id?`${c.id} ${c.name||""} ${c.brief||""}`:c.name;tgt.appendChild(o)}
    const ti=document.createElement("input");ti.type="text";ti.size=14;ti.placeholder="目标实体 id";
    const initT=()=>v.target||((g.cands||[])[0]||{}).id||"";ti.value=v.target||"";
    const shown=()=>{tgt.style.display=ti.style.display=pick()==="并入已有"?"":"none";if(pick()==="并入已有"&&!ti.value){ti.value=initT();tgt.value=ti.value;v.target=ti.value}};
    tgt.onchange=()=>{ti.value=tgt.value;v.target=tgt.value;save()};ti.oninput=()=>{v.target=ti.value;save()};
    for(const o of D.options){const lb=document.createElement("label");const r=document.createElement("input");r.type="radio";r.name="r_"+g.key;r.checked=pick()===o;lb.className=r.checked?"sel":"";lb.append(r,o);
      r.onchange=()=>{v.pick=o;save();for(const l of op.querySelectorAll("label"))l.className="";lb.className="sel";shown()};op.appendChild(lb)}
    op.append(tgt,ti);const nt=document.createElement("input");nt.type="text";nt.placeholder="备注";nt.value=v.note||"";nt.oninput=()=>{v.note=nt.value;save()};op.appendChild(nt);
    box.append(hd,tg,ln,op);shown();
  },
  doc(g,v){const p=v.pick||g.pre||"不确定";return {id:g.key,key:g.key,pre:g.pre,pick:p,target_id:p==="并入已有"?(v.target||""):"",type:g.type||null,std_name:g.std_name||null,note:v.note||""}}});
</script>
