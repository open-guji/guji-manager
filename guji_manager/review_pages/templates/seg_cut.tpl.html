<title>人裁切线</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*COMMON_CSS*/
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
#list .card{margin:0;display:flex;flex-direction:column;gap:6px}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.meta .ch{font:600 18px/1 var(--font-glyph);color:var(--fg)}
.win{position:relative;width:100%;max-width:440px;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:4px;cursor:crosshair;touch-action:manipulation}
.win img{position:absolute;image-rendering:pixelated;pointer-events:none;user-select:none}
.win .ln{position:absolute;pointer-events:none;background:#1a9e4b}
.win .ln.v{width:3px;margin-left:-1px;top:0;bottom:0}
.win .ln.h{height:3px;margin-top:-1px;left:0;right:0}
.row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.row button{padding:4px 10px;min-height:30px;font-size:12px}
.row button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
/*SHELL*/
<script>
const D=/*DATA*/null;
/*COMMON_JS*/
/*STORE_JS*/
// 每格一张卡：只放大本格这一块图。点哪里切就在哪里画一条绿线（默认竖线；右下角可切成横线），点已有的线取消。
// 画了线这格就算定了；没画的格不算数。存档 raw={v:"cut",cuts:[{d:"v"|"h",p}]}（列图像素坐标）。
const MAJOR=D.tpl_version.split(".")[0], P=D.per_page;
const byId={};D.items.forEach((it,i)=>byId[it.id]={it,i});
const r1=y=>Math.round(y*10)/10;
const toPage=(it,c)=>({d:c.d,p:r1(c.d==="v"?c.p*it.kx+it.cx:c.p*it.ky+it.cy)});
const S=makeStore({key:"seg-cut-"+D.book+"-v"+MAJOR,pageOf:k=>Math.floor(((byId[k]||{i:0}).i)/P),
  docOf:(k,raw)=>{const it=(byId[k]||{}).it||{};const cuts=raw.cuts||[];
    return {cell:k,vol:it.vol,label:"cut",cuts,cuts_page:cuts.map(c=>toPage(it,c))}}});
const st=S.st;
if(!st.dir)st.dir="v";
const cutsOf=it=>{const r=S.raw(it.id);return r&&r.cuts?r.cuts:[]};
function addCut(it,d,p){
  const cs=cutsOf(it).slice();
  const j=cs.findIndex(c=>c.d===d&&Math.abs(c.p-p)<=5);
  if(j>=0)cs.splice(j,1);else cs.push({d,p:r1(p)});
  if(cs.length)S.set(it.id,{v:"cut",cuts:cs});else S.clear(it.id);
}
function paint(box,it){
  const win=box.querySelector(".win"),W=it.wx1-it.wx0,H=it.wy1-it.wy0;
  for(const e of win.querySelectorAll(".ln"))e.remove();
  for(const c of cutsOf(it)){const d=document.createElement("div");d.className="ln "+c.d;
    if(c.d==="v")d.style.left=((c.p-it.wx0)/W*100)+"%";else d.style.top=((c.p-it.wy0)/H*100)+"%";win.appendChild(d)}
}
function card(it){
  const box=document.createElement("div");box.className="card";
  const m=document.createElement("div");m.className="meta";
  const ch=document.createElement("span");ch.className="ch";ch.textContent=it.expect.length?it.expect.join(""):(it.shows||"？");
  const id=document.createElement("span");id.textContent=it.id+(it.note?" · "+it.note:"");
  m.append(ch,id);box.appendChild(m);
  const W=it.wx1-it.wx0,H=it.wy1-it.wy0,win=document.createElement("div");win.className="win";win.style.aspectRatio=W+"/"+H;
  const im=document.createElement("img");im.src=it.img;im.alt="本格";
  im.style.width=(it.iw/W*100)+"%";im.style.left=(-it.wx0/W*100)+"%";im.style.top=(-it.wy0/H*100)+"%";win.appendChild(im);
  win.onclick=e=>{const rc=win.getBoundingClientRect();
    if(st.dir==="v")addCut(it,"v",it.wx0+(e.clientX-rc.left)/rc.width*W);else addCut(it,"h",it.wy0+(e.clientY-rc.top)/rc.height*H);
    paint(box,it);stat()};
  box.appendChild(win);
  const row=document.createElement("div");row.className="row";row.append("点哪里切　");
  for(const [d,t] of [["v","竖切"],["h","横切"]]){const b=document.createElement("button");b.type="button";b.textContent=t;b.dataset.d=d;
    b.onclick=()=>{st.dir=d;S.save();syncDir()};row.appendChild(b)}
  box.appendChild(row);paint(box,it);return box;
}
function syncDir(){for(const b of document.querySelectorAll(".row button"))b.setAttribute("aria-pressed",String(b.dataset.d===st.dir))}
const NP=()=>Math.max(1,Math.ceil(D.items.length/P));
function stat(){
  const got=D.items.filter(it=>cutsOf(it).length).length;
  $("stat").textContent=`已审 ${st.seen}/${NP()} 页 · 已画线 ${got}/${D.items.length} 格`;
  $("bar").style.width=(got/Math.max(1,D.items.length)*100)+"%";
}
function render(){
  st.page=Math.min(Math.max(0,st.page),NP()-1);
  const L=$("list");L.textContent="";
  D.items.slice(st.page*P,(st.page+1)*P).forEach(it=>L.appendChild(card(it)));
  syncDir();
  $("pg").textContent=`第 ${st.page+1} / ${NP()} 页`;
  $("sub").textContent=`册 ${D.book} · ${D.items.length} 格 · 模板 ${D.tpl_version}`;
  $("hint").textContent=D.hint||"点哪里切，就在哪里画一条绿线（默认竖线，双行小字左右并排从中间切开；要横着切就点下面「横切」）。点已有的线取消。每点一下就存后台。没画线的格不算数。";
  for(const id of ["prev","prev2"])$(id).disabled=st.page===0;
  for(const id of ["next","next2"])$(id).textContent=st.page===NP()-1?"完成":"下一页";
  stat();S.save();
}
function exportAll(){
  const labels=[],unconfirmed=[];
  for(const it of D.items){const cs=cutsOf(it);
    if(cs.length)labels.push({cell:it.id,label:"cut",cuts:cs,cuts_page:cs.map(c=>toPage(it,c)),how:S.how(it.id)});else unconfirmed.push(it.id)}
  return {page_type:TPL.type,tpl_version:TPL.version,book:D.book,pages_seen:st.seen,labels,unconfirmed};
}
function next(){
  const its=D.items.slice(st.page*P,(st.page+1)*P);
  saveDoc("s_b"+D.book+"_p"+st.page,{kind:"secs",page:st.page,secs:takeSecs(),ids:its.map(it=>it.id)});
  st.seen=Math.max(st.seen,st.page+1);
  if(st.page<NP()-1)st.page++;else{S.flush();showOut(exportAll())}
  render();scrollTo(0,0);
}
for(const id of ["next","next2"])$(id).onclick=next;
for(const id of ["prev","prev2"])$(id).onclick=()=>{st.page--;render();scrollTo(0,0)};
$("export").onclick=()=>showOut(exportAll());
wireDlg();render();
initDB(async()=>{if(await S.restore())render()});
</script>
