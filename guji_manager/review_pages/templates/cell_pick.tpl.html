<title>逐格定字</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*COMMON_CSS*/
.ctx{font:16px/1.7 var(--font-glyph)}.ctx b{background:var(--accent);color:var(--accent-fg);padding:0 4px;border-radius:3px}
.cands{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.cand{font:600 22px/1 var(--font-glyph);padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px}
.cand small{font:11px var(--font-ui);color:var(--muted)}.cand.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}.cand.sel small{color:var(--accent-fg)}
.cand.pre::after{content:"预选";font:10px var(--font-ui);opacity:.8}
.cand.sp{font:600 15px var(--font-ui)}
.strip{display:flex;gap:3px;margin:6px 0;align-items:center;flex-wrap:nowrap;overflow-x:auto}.strip img{height:56px;width:auto;background:#fff;border:2px solid transparent;border-radius:3px}.strip img.at{border-color:var(--bad)}
.cellimg{max-height:90px;background:#fff;border-radius:4px;padding:2px}
select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px}
</style>
/*SHELL*/
<script>
const D=/*DATA*/null;
/*COMMON_JS*//*STORE_JS*//*PAGER_JS*/
// 与 A24 终审标注页同字段：cell、pick、other、note、review（存疑）、at；另加 pre、secs、how。
// 1.1：点一下就存；重开从后台读回；候选之外可选「切分错/看不清/库里无此字（备注写 IDS）」；上下文里标整理本字；可按 kind 筛选。
const SPECIAL=[["seg","切分错"],["unclear","看不清"],["none","库里无此字（备注写 IDS）"]];
const pickOf=(it,v)=>v.sp?"__"+v.sp+"__":(v.pick??it.pre);
makePager({key:"cellpick-"+D.page_type,prefix:"p",all:D.items,per:D.per_page,filterKey:"kind",filters:[...new Set(D.items.map(x=>x.kind).filter(Boolean))],
  hintText:D.hint||"每格看上下文（【】里是整理本字）和字块图，点选正确的字，已按预选选好（预选字带「预选」标，小字是各候选的来源和依据；手填框不预填）；候选下面小字是它的来源。都不对：填其它字，或点「切分错／看不清／库里无此字」（无此字请在备注写 IDS）。拿不准勾存疑。每点一下就存。",
  legacy:[["cellpick-"+D.page_type+"-"+D.book+"-1.0.0",o=>({v:Object.fromEntries(Object.keys(Object.assign({},o.pick,o.other,o.note,o.review)).map(id=>[id,{raw:{pick:o.pick&&o.pick[id],other:o.other&&o.other[id],note:o.note&&o.note[id],review:!!(o.review&&o.review[id])},how:"click",t:Date.now()}])),seen:o.seen||0,page:o.page||0})]],
  stats:(done,V)=>{const n=done.filter(x=>pickOf(x,V(x.id))!==x.pre).length;return `改判 ${n}`},
  draw(it,box,v,save,refresh){
    const hd=document.createElement("div");hd.className="stat";hd.textContent=it.id+(it.kind?" · "+it.kind:"")+(it.fact?" · "+it.fact:"");
    const cx=document.createElement("div");cx.className="ctx";
    const lt=(it.strip||[]).length?(it.left||"").slice(-12):(it.left||""),rt=(it.strip||[]).length?(it.right||"").slice(0,12):(it.right||"");
    if(it.sent&&it.sent.t){ // 点校标出的标点专名号句子：标点红、专名下划线（虚线＝未挂库）、本格加粗框
      const ch=Array.from(it.sent.t),pm=it.sent.marks||[];
      for(let i=0;i<=ch.length;i++){
        pm.filter(m=>m.kind==="punct"&&m.pos===i).forEach(m=>{const e=document.createElement("span");e.style.color="#a33";e.textContent=m.ch;cx.append(e)});
        if(i===ch.length)break;
        const e=document.createElement(i===it.sent.at?"b":"span");e.textContent=ch[i];
        const en=pm.find(m=>m.kind==="entity"&&i>=m.start&&i<m.end);
        if(en){e.style.textDecoration="underline";e.style.textDecorationStyle=(en.status==="matched"||en.status==="matched_multi")?"solid":"dashed";e.style.textUnderlineOffset="3px"}
        cx.append(e);
      }
    }else{
    cx.append(document.createTextNode(lt));const b=document.createElement("b");b.textContent=it.ref_char?"【"+it.ref_char+"】":"〔？〕";cx.append(b,document.createTextNode(rt));
    }
    let sp0=null;
    if((it.strip||[]).length){ // 横向邻格条：左右各几格的字块图，目标格红框；下面配前后各 12 字
      sp0=document.createElement("div");sp0.className="strip";
      it.strip.forEach((src,i)=>{const im=document.createElement("img");im.src=src;im.alt=i===it.strip_at?"目标格":"邻格";if(i===it.strip_at)im.className="at";sp0.appendChild(im)});
    }
    const cs=document.createElement("div");cs.className="cands";
    if(it.img){const im=document.createElement("img");im.className="cellimg";im.src=it.img;im.alt="字块";cs.appendChild(im)}
    if(D.mode==="check"){ // 核对模式：显示机器答案和来源，只点「对」「错（填字）」「看不清」
      const big=document.createElement("span");big.style.cssText="font:600 34px/1 var(--font-glyph);margin-right:6px";big.textContent=it.pre||"？";cs.appendChild(big);
      const srcs=document.createElement("small");srcs.style.cssText="color:var(--muted);max-width:220px";srcs.textContent="机器答案"+((it.cands||{})[it.pre]?"：来源 "+it.cands[it.pre].join("、"):"");cs.appendChild(srcs);
      const st3=()=>v.sp==="unclear"?"unclear":(v.wrong||(v.pick&&v.pick!==it.pre)?"wrong":(v.pick===it.pre?"ok":""));
      const bt=(k,t)=>{const b=document.createElement("button");b.className="cand sp";b.dataset.k=k;b.textContent=t;return b};
      const ok=bt("ok","对"),wr=bt("wrong","错（填字）"),un=bt("unclear","看不清");
      const fill=document.createElement("input");fill.type="text";fill.size=4;fill.placeholder="正确的字";fill.value=v.other||"";
      const paint=()=>{const k=st3();for(const b of [ok,wr,un])b.classList.toggle("sel",b.dataset.k===k);fill.style.display=k==="wrong"?"":"none"};
      ok.onclick=()=>{v.pick=it.pre;delete v.sp;delete v.wrong;v.other="";fill.value="";save();paint()};
      un.onclick=()=>{v.sp="unclear";delete v.wrong;save();paint()};
      wr.onclick=()=>{delete v.sp;v.wrong=1;v.pick="";fill.style.display="";fill.focus();save();paint()};
      fill.oninput=()=>{v.other=fill.value;v.pick=fill.value||"";delete v.sp;save();paint()};
      const lb=(it.lib&&it.lib!==it.pre)?bt("lib","改作 "+it.lib):null; // ref_check：库首位一键改作
      if(lb)lb.onclick=()=>{delete v.sp;v.wrong=1;v.pick=it.lib;v.other=it.lib;fill.value=it.lib;save();paint()};
      cs.append(ok,wr,...(lb?[lb]:[]),un,fill);
      const nt2=document.createElement("input");nt2.type="text";nt2.placeholder="备注";nt2.size=20;nt2.value=v.note||"";nt2.oninput=()=>{v.note=nt2.value;save()};cs.appendChild(nt2);
      box.append(hd,...(sp0?[sp0]:[]),cx,cs);paint();return;
    }
    const sel=()=>{const p=pickOf(it,v);for(const x of cs.querySelectorAll(".cand"))x.classList.toggle("sel",x.dataset.k===p)};
    for(const [ch,srcs] of Object.entries(it.cands||{})){
      const bt=document.createElement("button");bt.className="cand"+(it.pre===ch?" pre":"");bt.dataset.k=ch;
      bt.append(document.createTextNode(ch));const sm=document.createElement("small");sm.textContent=(srcs||[]).join("、");bt.appendChild(sm);
      bt.onclick=()=>{v.pick=ch;delete v.sp;v.other="";ot.value="";save();sel()};cs.appendChild(bt);
    }
    for(const [k,t] of SPECIAL){const bt=document.createElement("button");bt.className="cand sp";bt.dataset.k="__"+k+"__";bt.textContent=t;
      bt.onclick=()=>{if(v.sp===k)delete v.sp;else v.sp=k;save();sel()};cs.appendChild(bt)}
    const ot=document.createElement("input");ot.type="text";ot.placeholder="其它字";ot.size=4;ot.value=v.other||"";
    ot.oninput=()=>{v.other=ot.value;if(ot.value){v.pick=ot.value;delete v.sp}save();sel()};cs.appendChild(ot);
    const rv=document.createElement("label");const ck=document.createElement("input");ck.type="checkbox";ck.checked=!!v.review;ck.onchange=()=>{v.review=ck.checked;save()};rv.append(ck," 存疑，留人审");cs.appendChild(rv);
    const nt=document.createElement("input");nt.type="text";nt.placeholder="备注（无此字写 IDS）";nt.size=24;nt.value=v.note||"";nt.oninput=()=>{v.note=nt.value;save()};cs.appendChild(nt);
    box.append(hd,...(sp0?[sp0]:[]),cx,cs);sel();
  },
  doc(it,v){const p=pickOf(it,v);return {cell:it.id,pre:it.pre,pick:p,verdict:v.sp||"char",other:v.other||"",note:v.note||"",review:!!v.review,kind:it.kind||null,pilot:it.pilot||null,ref_char:it.ref_char||null,at:Date.now()}}});
</script>
