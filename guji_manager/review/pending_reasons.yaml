# PendingReason：待审原因 enum 与配置（全项目唯一真源，A31 2026-11-03；读取接口 open_guji_cv/review/pending_reason.py）
#
# 真源位置（sheldon 11-03 定）：open-guji-cv（pipeline 生成这个原因），enum 类名 PendingReason，字段名一律 pending_reason。
# 本 enum 只回答「这一格为什么还在待审」，不是判定依据。判定依据（证据）是另一回事：现在是 why[] 疑问码，将来可另立 enum，不并进这里。
# 不确定的一律写 unknown（含历史数据回填、以后新增的数据），保证每一处都有值、口径一致。
#
# 规则（sheldon 11-03）：
#   - 所有事件、待审单、裁决、待选里只写英文 enum 名（下面每条的键），不写中文、不写码。
#   - code 只是配置里的一个值，方便按大类排序、分组统计；改 enum 名要走弃用流程（deprecated_by），code 永不复用。
#   - 一格只有一个主原因（reason），按 priority 从小到大取第一个命中的；原始疑问码照旧放 why[] 当证据。
#
# 字段：
#   code        分类码（大类字母 + 两位数）
#   category    大类 enum（见 categories）
#   route       去向 enum（见 routes）
#   owner       负责修算法／数据的人（成员名；人审格的「审」由 reviewer 决定）
#   reviewer    最终谁看：human（人）／llm_then_human（大模型先过，只收 high，其余回人）／none（算法放行或留后，不出单）
#   priority    判定顺序（小的先判；open_guji_cv/review/reasons.py 按它逐条试，第一条命中的就是这格的原因）
#   label       网页、控制台显示的短名（大白话；对外一律说「参校本」，不说「整理本」）
#   hint        网页卡片上的一句说明：为什么在这里、人该看什么
#   ui          网页卡片形态：pick（点选，整理本字预选）／choose3（三选一）／free（自由录字）／page（整页看）／confirm（看一眼确认）
#   detect      判定依据（给实现者看）
#   legacy      旧字段对应：cause（cv 成因码）／cls（卡片类别）／taxonomy（manager 小类）／v2（A31 统计子类）

version: 1

# 改名（deprecated_by 流程）：旧名 → 新名。数据里读到旧名时 parse() 换成新名；code 不变、永不复用。
renamed:
  ref_replaced: ref_ocr_diff      # 2026-11-06 Sheldon：P01/P02 旧名看不出区别
  ref_mismatch: ref_final_diff
  group_form_open: variant_form_open   # 2026-11-07 A24 Z 类梳理：写法待定不是形近字组产生的，改归异体 V02（Z06 不再用）

categories:
  segmentation: {code: S, label: 切分位置}
  occlusion:    {code: D, label: 遮挡}
  group:        {code: Z, label: 形近字组}
  hard_pair:    {code: H, label: 极难形近}
  near_form:    {code: N, label: 形近护栏}
  variant:      {code: V, label: 异体}
  glyph_lib:    {code: L, label: 字形库}
  reference:    {code: R, label: 参校本缺位}
  mismatch:     {code: P, label: 与参校本不一致}
  review:       {code: X, label: 复审与其他}
  anchor:       {code: A, label: 标点专名重挂}

routes:
  human:    {label: 一定人审}
  llm:      {label: 大模型统一过一遍（只收 high，其余回人审）}
  algo:     {label: 先改算法，改完剩下的并入 llm}
  deferred: {label: 留到标点、专名阶段}

reasons:
  # ── S 切分 ─────────────────────────────────────────────
  seg_page_unaligned:
    code: S01
    category: segmentation
    route: algo
    owner: A22
    reviewer: human
    priority: 20
    label: 整页对不上
    hint: 这一页很多格都对不上参校本，多半是切分或对位错了，请看整页
    ui: page
    detect: 正文页（非职名等页型）上本格无整理本对位（〓 不算），且同页无对位格 ≥10；或本格是弱证据格（有对位、机器字不同）且本列一致率 <0.5、同页这样的格 ≥10；已钉页直接人审
    legacy: {cause: [A1, A3, A4, A5, A9], taxonomy: [S2, S3, S4, S5, S6], v2: "S 成片页"}
  seg_col_unaligned:
    code: S02
    category: segmentation
    route: algo
    owner: A22
    reviewer: human
    priority: 21
    label: 整列对不上
    hint: 这一列可能挤格或整列错位
    ui: page
    detect: 本格无对位、整理本有字，且同列无对位格 ≥5
    legacy: {cause: [A3, A4], taxonomy: [S2, S4], v2: "S 成片列"}
  col_width_out_of_band:
    code: S03
    category: segmentation
    route: algo
    owner: A22
    reviewer: human
    priority: 22
    label: 列宽异常
    hint: 本页列宽不均，版框可能量错，先看整页
    ui: page
    detect: 页打 flag col_width_out_of_band（cv#929 border_detect_gate 1.3，送审不拦）
    legacy: {}
  seg_defect:
    code: S04
    category: segmentation
    route: human
    owner: A22
    reviewer: human
    priority: 10
    label: 切坏格
    hint: 这一格切得不完整，机器认不出字；请看书影，把字直接写进框里
    ui: free
    detect: 人或闸标了切坏格（confirm v=seg_defect，或单上 cls=seg_defect）；史記夹注两行分法不均、按整理本切的格（doubt 码 jiazhu_uneven，cv#1011）也归这里，细分 jiazhu_uneven；整理本这位没字、且格框比本页同类格小得多（边长 <0.6 倍中位数，或长宽比 <0.35；半截字、墨点、框角）的碎片格也归这里，细分 clipped（R02 深挖 11-06）
    legacy: {cls: [seg_defect]}

  # ── D 遮挡 ─────────────────────────────────────────────
  occluded_with_ref:
    code: D01
    category: occlusion
    route: algo
    owner: A32
    reviewer: llm_then_human
    priority: 11
    label: 有遮挡
    hint: 被印章或污渍遮住，下面的小字是参校本的字，看图上像不像
    ui: confirm
    detect: 成因 D（印章框内＋噪点≥4），整理本有字
    legacy: {cause: [D], cls: [occluded], taxonomy: [O1, O2, O0], v2: "D 遮挡·整理本有字"}
  occluded_no_ref:
    code: D02
    category: occlusion
    route: human
    owner: A32
    reviewer: human
    priority: 12
    label: 有遮挡且参校本缺
    hint: 被盖住了，参校本这里也没有字，请尽量从图上读
    ui: free
    detect: 成因 D，整理本这位空或〓（occ.ref_blank=true）
    legacy: {cause: [D], cls: [occluded], taxonomy: [O3], v2: "D 遮挡·整理本缺字"}

  # ── H 极难形近（先于 Z/N 判）─────────────────────────────
  hard_pair:
    code: H01
    category: hard_pair
    route: deferred
    owner: A24
    reviewer: none
    priority: 30
    label: 极难形近
    hint: 日曰、己已巳这类刻法几乎不分的字，留到加标点、识专名时一起按文意定
    ui: choose3
    detect: 本格机器字、整理本字、库首选里出现的字全在 {日 曰 己 已 巳} 内，且至少两个不同；或三者同字而字组是 jys/ry、或库前两名都在组内（A24 Z01 深挖 11-06）
    legacy: {cls: [ji_yi_si], cause: [C], v2: "H 极难形近"}

  # ── Z 形近字组 ─────────────────────────────────────────
  group_abstain:
    code: Z01
    category: group
    route: llm
    owner: A24
    reviewer: llm_then_human
    priority: 40
    label: 形近字·没把握
    hint: 形近字，几种判法都没给出字，请按前后文选
    ui: pick
    detect: 有字组证据、字组没定字，解法一个字都没给（补放、联合判、复核都算；场景写在 detail「组:lift|joint|review」）；字组只是同字异形之争（一个字）也落这里
    legacy: {cause: [C], cls: [near_form], taxonomy: [Z1], v2: "Z 没有解法给字(弃权)"}
  group_conflict:
    code: Z02
    category: group
    route: llm
    owner: A24
    reviewer: llm_then_human
    priority: 41
    label: 形近字·判法打架
    hint: 几种判法给了不同的字，请按前后文选
    ui: pick
    detect: 解法给了 ≥2 个不同字（同字异形先折叠，manager#296）；补放、联合判、复核都算。联合判只有一个字（共字组没表态）不算，归 Z07
    legacy: {cause: [C], taxonomy: [Z2], v2: "Z 解法之间冲突"}
  group_demoted:
    code: Z03
    category: group
    route: llm
    owner: A24
    reviewer: llm_then_human
    priority: 42
    label: 形近字·复核推翻
    hint: 复核给了与放行字不同的字
    ui: pick
    detect: 复核（decision=demote），解法只给一个字、与放行字不同；复核时解法没给字归 Z01、≥2 字归 Z02、整理本是组里另一形（group_flow_ref_dissent）归 Z04
    legacy: {cause: [C], taxonomy: [Z2], v2: "Z 复核给了不同于放行字的字(降审)"}
  group_ref_dissent:
    code: Z04
    category: group
    route: llm
    owner: A24
    reviewer: llm_then_human
    priority: 43
    label: 形近字·与参校本不同
    hint: 判法给的字和参校本这里的字不一样
    ui: pick
    detect: 解法给了一个字，参校本（现役或坐标对位）是另一个真字：补放 why=ref_dissent/coord_dissent，复核疑问码 group_flow_ref_dissent；参校字是〓的不算，落 R01（A24 Z 类梳理 11-07）
    legacy: {cause: [C], cls: [ref_conflict], taxonomy: [Z2], v2: "Z 解法给的字与整理本(坐标)对位不同"}
  group_weak:
    code: Z05
    category: group
    route: llm
    owner: A24
    reviewer: llm_then_human
    priority: 44
    label: 形近字·证据弱（已停用）
    hint: 已停用（2026-11-06）：旧数据里还有，不再产出；字形单路没把握并入 Z01，整理本缺位落 R 类
    ui: pick
    detect: 已停用；原为字组其余情况（why=joint/weak）
    legacy: {cause: [C], taxonomy: [Z3], v2: "Z 证据偏弱"}
  group_unconfirmed:
    code: Z07
    category: group
    route: llm
    owner: A24
    reviewer: llm_then_human
    priority: 46
    label: 形近字·差一路确认
    hint: 判法给了一个字，但还差另一路（另一种判法或相邻字组）确认，请看这个字对不对
    ui: confirm
    detect: 解法只给一个字（同字异形折叠后），why=weak（给字的只有不许单独补放的解法，lift_needs）或 why=joint（联合判共字组弃权／没表态）（A24 Z 类梳理 11-07 新增；原落 Z01、Z02）
    legacy: {cause: [C], taxonomy: [Z3], v2: "Z 证据偏弱"}
  # ── N 形近护栏 ─────────────────────────────────────────
  near_form_guard:
    code: N01
    category: near_form
    route: llm
    owner: A24
    reviewer: llm_then_human
    priority: 56
    label: 形近字
    hint: 有长得很像的字（十士、西酉…），要结合前后文看
    ui: pick
    detect: guard=conflict/never_match，或参校字与机器字／库候选前三构成手工形近表（cv NEVER_MATCH_FAMILIES）里的一对；仅疑问码 near_form（家族字碰巧在候选里）不算（A24 N01 深挖 11-06）
    legacy: {cls: [near_form], cause: [C], taxonomy: [Z4], v2: "N 形近护栏拦下"}

  # ── V 异体 ────────────────────────────────────────────
  variant_pair:
    code: V01
    category: variant
    route: human        # 待定：A24 说留人审；分流稿说算法后并 llm
    owner: A24
    reviewer: human
    priority: 55
    label: 异体字
    hint: 两个字是异体，要确认本书刻的是哪个
    ui: pick
    detect: 整理本字与库首选或机器字是异体对（边分型 T1／T2；T3 通假、简繁不算；前五里其它候选不看，A24 V01 深挖 11-06），且不在字组里；或 why 含 ref_lib_variant/variant_indirect/replace_form/channel_off
    legacy: {cause: [B], cls: [variant], taxonomy: [M1, M2], v2: "V 组外异体对"}

  variant_form_open:
    code: V02
    category: variant
    route: algo
    owner: A24
    reviewer: human
    priority: 45
    label: 写法待定
    hint: 知道是哪个字，但不确定本书刻的是哪种写法，只在组内写法里挑
    ui: pick
    detect: 疑问码 form_open：seed_admit 整理本通道放行位，整理本字在用字账（variant_ledger）≥2 写法的同义组里、decide_form 定不了写法（不是形近字组流程产生的）。旧名 group_form_open、码 Z06（2026-11-07 改归异体类，Z06 不再用）
    legacy: {cls: [form_open], cause: [C], v2: "Z 同义组"}

  # ── L 字形库 ──────────────────────────────────────────
  lib_missing:
    code: L01
    category: glyph_lib
    route: human
    owner: A24
    reviewer: human
    priority: 51
    label: 少见的字
    hint: 字形库里还没有这个字，这一格就是它第一次进库，请确认图上是不是参校本的字
    ui: pick
    detect: 参校字在本书库里 0 例（第一次进库；刻例只算本书版本，借来的不算；A23 11-06）。11-07 起只留这一种：5a 判 diff 但本书库已有这个字（≥3 例）的印糊整字改归 L05／L04，整理本这一位没字的（ref_blank）改归 R02。没接字形库时（不知道刻例数）仍按 5a 判 diff（why 含 lib_miss／「库里没有」）归这里
    legacy: {cause: [F], cls: [lib_miss], taxonomy: [L1], v2: "L 库里没有这个字"}
  lib_sparse_dissent:
    code: L02
    category: glyph_lib
    route: llm
    owner: A23
    reviewer: llm_then_human
    priority: 58
    label: 刻例太少
    hint: 这个字本书库里只有一两个刻例，库认不准；机器字和参校本可能一致也可能不一致，请看图确认是不是参校本的字
    ui: pick
    detect: 参校字在本书库里 1～2 例（只算本书版本；0 例归 L01），不论机器字是否＝参校字（11-07 起 L03 并入；机器字＝参校字的多半是上下文选了形近字、被护栏 ctx_guard_ref 改回）；大模型选中的若是这个少样本字 → 回人审。detail 写「参校字>机器字」
    legacy: {cause: [I], taxonomy: [L4], v2: "L 库样本过少·机器字≠整理本"}
  lib_sparse_agree:
    code: L03
    category: glyph_lib
    route: human
    owner: A23
    reviewer: human
    priority: 57
    label: 刻例太少（已停用）
    hint: 已停用（2026-11-07）：旧数据里还有，不再产出；本书库 1～2 例的格一律落 L02
    ui: pick
    detect: 已停用；原为参校字本书库 1～2 例且机器字＝参校字（A23 第 6 轮梳理，sheldon 11-07 并入 L02）
    legacy: {cause: [I], taxonomy: [L4], v2: "L 库样本过少·上下文=整理本"}
  lib_unrecognized:
    code: L04
    category: glyph_lib
    route: algo
    owner: A23
    reviewer: llm_then_human
    priority: 61
    label: 库认不出
    hint: 库里有这个字，但这一格认不出，多半是印淡或压了框线
    ui: pick
    detect: 兜底——有参校字、机器字（seed_admit char）＝参校字、前面各条都没中（不看刻例数、不看库认不认；不接字形库时 L02 的格也落这里）。另收 5a 判 diff 而本书库已有这个字（≥3 例）、没带乱码闸码的印糊整字（细分 lib_diff，11-07 起，原落 L01）。细分见 pending_reason_detail（reasons.lib_unrecognized_kind）；旧人裁锚点漂移（human_unbound）改归 X01
    legacy: {cause: [H, I], taxonomy: [L2, L3], v2: "L 库样本够·上下文=整理本·库不认"}
  garble_gate:
    code: L05
    category: glyph_lib
    route: algo
    owner: A24
    reviewer: llm_then_human
    priority: 52
    label: 像框线或墨点
    hint: 格图印糊，库首位是错字被乱码闸拦下；整理本字多半是对的，先看图
    ui: free
    detect: why 含 ctx_garble_shape / shadow_veto / ctx_garble_rare，且整理本这位有字（无对位的糊格落 R02）；11-07 起也收 5a 判 diff（cov<0.85）、本书库已有这个字（≥3 例）而带这些码的格（原落 L01）
    legacy: {cause: [A6], taxonomy: [S1], v2: "L 乱码闸／影子闸拦下"}

  # ── R 整理本缺位 ──────────────────────────────────────
  glyph_pending:
    code: R03
    category: reference
    route: deferred
    owner: A24
    reviewer: none
    priority: 49
    label: 待收字
    hint: 整理本这里是没收进 Unicode 的僻字，暂时找不到合适异体字；已判过，页面先显示字图不留字，将来找到字按码位统一回填（不同于真图／小篆的留图不留字）
    ui: confirm
    detect: 整理本这位是私用码，且该码位在私用码表里登记为「已判定待收」（sheldon 11-05）；没登记过的仍记 ref_lacuna。detail 只写永久编号「来源:码位」（如 daizhige:U+E123、siku-qiefen-v2:U+F1001；两套码不一一对应，必须带来源；占位码 U+1001 等以图代字属真图，不进待收字）
    legacy: {v2: "R 整理本缺字·待收字"}
  ref_lacuna:
    code: R01
    category: reference
    route: algo
    owner: A24
    reviewer: llm_then_human
    priority: 50
    label: 参校本缺字
    hint: 参校本这里写的是〓（没码位的生僻字），请从图上读；若是字形引述（「古文作〓」「說文作〓」等），不硬录常用字，标「图片格」只留图，说明写引述什么字
    ui: free
    detect: 整理本这位是〓或私用码；先走新图源文本层与私用码表（cv#932），再大模型，读不准的人审
    legacy: {cause: [A2], taxonomy: [P1], v2: "R 整理本缺字(〓/缅甸)"}
  ref_gap:
    code: R02
    category: reference
    route: llm
    owner: A24
    reviewer: llm_then_human
    priority: 53
    label: 参校本这里没字
    hint: 参校本这一位没有字（漏字或引文异文），请核对
    ui: pick
    detect: 整理本这位没字，且不成片（不属 S01/S02）
    legacy: {cause: [A9, A1], v2: "R 整理本这位没字·上下文不足"}

  # ── P 与整理本不一致 ──────────────────────────────────
  # P01 与 P02 的区别在「哪一步和参校本不同」：
  #   P01 ref_ocr_diff   Step6 对位（align_ref）时：机器识别的字（字形库首位）和参校本按文本对位，这格落在 replace 段，识别字≠参校字。
  #   P02 ref_final_diff 文本对位没给这格标签（所在段被 label_page 丢掉），整理本字只来自坐标对位，机器字≠它（P01/P02 兜底）。
  #   两条都中时按 priority 记 P01。
  ref_ocr_diff:               # 2026-11-06 由 ref_replaced 改名（Sheldon），旧名见 renamed
    code: P01
    category: mismatch
    route: llm
    owner: A24
    reviewer: llm_then_human
    priority: 60
    label: 识别字与参校本不同
    hint: 机器识别的字和参校本对位时就不同（对位的 replace 段），位置可能差一两格
    ui: pick
    detect: Step6 align_ref 文本对位：识别字（字形库首位）与参校本 difflib 对位落在 replace 段（align_op=replace / why=replace_align）
